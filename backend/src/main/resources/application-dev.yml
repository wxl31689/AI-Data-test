spring:
  datasource:
    url: jdbc:h2:file:./.data/testdata-agent;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  address: ${BACKEND_BIND_ADDRESS:127.0.0.1}

